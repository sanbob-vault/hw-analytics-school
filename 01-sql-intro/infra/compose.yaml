name: artillery

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 127.0.0.1:${POSTGRES_FORWARD_PORT:-5432}:5432
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
